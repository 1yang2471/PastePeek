name: 功能建议
description: 提议符合 PastePeek 产品边界的改进
title: "[Feature] "
labels:
  - enhancement
  - needs-triage
body:
  - type: textarea
    id: problem
    attributes:
      label: 用户问题
      description: 描述当前工作流中的具体困难。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明期望的行为，以及它如何保持纯本地运行。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
  - type: checkboxes
    id: boundaries
    attributes:
      label: 产品边界
      options:
        - label: 该建议不要求保存剪贴板历史。
          required: true
        - label: 该建议不要求上传剪贴板内容或使用云服务。
          required: true
