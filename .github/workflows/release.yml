name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: 验证标签与版本一致
        shell: pwsh
        run: |
          $version = python -c "from src.version import __version__; print(__version__)"
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match version $version"
          }
      - name: 安装依赖
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: 运行质量门禁
        run: |
          python -m ruff check src tests scripts build.py run_tests.py generate_icon.py render_hud_asset.py
          python run_tests.py
          python -m compileall -q src tests scripts
          python -m pip_audit -r requirements-dev.txt --progress-spinner off
      - name: 构建 Windows 单文件程序
        run: python build.py
      - name: 验证 SHA-256
        shell: pwsh
        run: |
          $expected = (Get-Content dist/PastePeek.exe.sha256).Split()[0]
          $actual = (Get-FileHash dist/PastePeek.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw "SHA-256 verification failed" }
      - name: 创建 GitHub Pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python -c "from src.version import __version__; print(__version__)"
          $bundle = "dist/PastePeek-$version-win64.zip"
          if (-not (Test-Path -LiteralPath $bundle -PathType Leaf)) {
            throw "Release bundle not found: $bundle"
          }
          gh release create "${{ github.ref_name }}" `
            "dist/PastePeek.exe" `
            "dist/PastePeek.exe.sha256" `
            "$bundle" `
            "LICENSE" `
            "THIRD_PARTY_NOTICES.md" `
            "licenses/LGPL-3.0.txt" `
            "licenses/Lucide-ISC.txt" `
            "licenses/CPython-3.12-LICENSE.txt" `
            "licenses/PyInstaller-COPYING.txt" `
            --verify-tag `
            --prerelease `
            --generate-notes `
            --title "PastePeek ${{ github.ref_name }}"
