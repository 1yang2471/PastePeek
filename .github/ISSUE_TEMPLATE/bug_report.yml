name: 错误报告
description: 报告可复现的功能异常或行为回归
title: "[Bug] "
labels:
  - bug
  - needs-triage
body:
  - type: markdown
    attributes:
      value: 请勿提交剪贴板原文、个人信息或安全漏洞细节。
  - type: input
    id: version
    attributes:
      label: PastePeek 版本
      placeholder: 例如 2.0.0-rc.1
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Windows 与目标应用
      placeholder: 例如 Windows 11 24H2、Word 2024
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 说明发生了什么，不要粘贴敏感剪贴板内容。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 启动 PastePeek
        2. 复制已脱敏的示例内容
        3. 选择目标应用或主动操作
        4. 观察结果
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已移除剪贴板原文、个人信息和敏感路径。
          required: true
        - label: 这不是安全漏洞；安全问题将通过私密渠道报告。
          required: true
