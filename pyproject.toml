[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".cache",
    ".venv",
    "build",
    "dist",
    "pkg",
    "vendor_pkgs",
    "vendor_pkgs_full",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# 入口需要先调整模块路径，Qt 测试需要先设置平台插件环境变量。
"run_tests.py" = ["E402"]
"src/main.py" = ["E402"]
"tests/*.py" = ["E402"]
