name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装锁定依赖
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: 静态检查
        run: python -m ruff check src tests scripts build.py run_tests.py generate_icon.py render_hud_asset.py
      - name: 运行测试
        run: python run_tests.py
      - name: 编译检查
        run: python -m compileall -q src tests scripts
      - name: 审计完整开发与构建依赖
        run: python -m pip_audit -r requirements-dev.txt --progress-spinner off
      - name: 构建 Windows 单文件程序
        run: python build.py
      - name: 验证 SHA-256
        shell: pwsh
        run: |
          $expected = (Get-Content dist/PastePeek.exe.sha256).Split()[0]
          $actual = (Get-FileHash dist/PastePeek.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw "SHA-256 verification failed" }
      - name: 上传构建产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: PastePeek-windows-${{ github.sha }}
          if-no-files-found: error
          path: |
            dist/PastePeek.exe
            dist/PastePeek.exe.sha256
